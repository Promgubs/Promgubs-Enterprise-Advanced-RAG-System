x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
    QDRANT_URL: http://qdrant:6333
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
    - hf_cache:/root/.cache/huggingface

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 60
      start_period: 120s   # first boot downloads the BGE models

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_data:
  storage:
  hf_cache:
